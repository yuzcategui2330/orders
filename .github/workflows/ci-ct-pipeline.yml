name: CI/CT

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-ct-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: order
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Post12.gres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d order"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile
        run: chmod +x gradlew && ./gradlew compileJava --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Coverage gate (JaCoCo 80%)
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Publish JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          if-no-files-found: warn

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
